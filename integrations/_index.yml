  source: edge
  relationship: standard-participant
  contract_reference:
    register: Drugs@FDA (openFDA drug/drugsfda; application holder = sponsor_name)
    standard: FDA drug / biologic marketing application (21 CFR 314 / 601)
    spec_file: null
    role: fda-application-holder
    registered_name: VERASTEM INC
    matched_domain: null
    matched_by: register-name
    certified_products:
    - product: New Drug Application (approved) (Drugs@FDA)
      product_type: NDA
      lapsed: false
      products_sample:
      - AVMAPKI FAKZYNJA CO-PACK (COPACKAGED)
    applications_sample:
    - NDA219616
    signal_note: certified_products = one entry per application TYPE (NDA / ANDA / BLA), never per application;
      lapsed when every product under the type is Discontinued. Applications are context, never counted
    detected_by: sweep-clinical-trial-sponsors.py
    detected: '2026-10-21'
    register_name_note: register-name 'verastem' = verastem; no wikidata P856
    identity_source: register-name
    identity_note: register gave only the name; exact normalised match to the repo's apis.yml name, one repo, Wikidata
      P856 not contradicting (Kin 2026-10-20 decision 2)
  status: not-a-workflow
