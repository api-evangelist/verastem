description: 'Verastem Oncology (Verastem, Inc.) is a development-stage biopharmaceutical company
  focused on developing novel therapies for cancers driven by the RAS/MAPK pathway, including KRAS-mutant
  tumors. Its work includes the first FDA-approved treatment for KRAS-mutant recurrent low-grade serous
  ovarian cancer, plus a pipeline targeting KRAS G12D inhibition. As a clinical-stage pharmaceutical
  company it publishes no public developer API, developer portal, or SDKs; this profile was surfaced as
  a portfolio company of bessemer-venture-partners and enriched with verified identity only.'
